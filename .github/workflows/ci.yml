# Quick checks on every push and pull request: lint, then the built-in self-test
# from source on all three platforms. Executables are only built by release.yml.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes offgrid_finder.py tools/make_icon.py
      - name: Self-test
        run: python offgrid_finder.py --self-test
